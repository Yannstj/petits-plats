<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Les Petits Plats</title>
  </head>
  <body class="bg-surface font-sans">
    <header class="relative isolate px-8 pb-24 pt-8 text-center">
      <img src="/images/hero.jpg" alt="" class="absolute inset-0 -z-10 size-full object-cover" />
      <div class="absolute inset-0 -z-10 bg-black/35"></div>
      <p class="mb-16 text-left font-heading text-xl uppercase text-white">Les Petits Plats</p>
      <h1 class="mx-auto mb-8 max-w-3xl font-heading text-3xl uppercase text-primary md:text-5xl">
        Cherchez parmi plus de 1500 recettes du quotidien, simples et délicieuses
      </h1>
      <form role="search" class="mx-auto flex max-w-3xl items-center rounded-2xl bg-white p-2">
        <input
          id="search"
          type="search"
          placeholder="Rechercher une recette, un ingrédient, ..."
          class="flex-1 bg-transparent px-4 py-3 text-sm outline-none"
        />
        <button
          type="submit"
          aria-label="Rechercher"
          class="flex size-12 items-center justify-center rounded-xl bg-black text-white"
        >
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 5 5" stroke-linecap="round" />
          </svg>
        </button>
      </form>
    </header>
    <main class="mx-auto max-w-6xl p-8">
      <div class="mb-8 flex flex-wrap items-start justify-between gap-4">
        <div class="flex flex-wrap gap-4">
          <div id="filter-ingredients" class="w-48 rounded-xl bg-white"></div>
          <div id="filter-appliances" class="w-48 rounded-xl bg-white"></div>
          <div id="filter-ustensils" class="w-48 rounded-xl bg-white"></div>
        </div>
        <p id="recipe-count" class="text-xl font-bold"></p>
      </div>
      <section id="recipes" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
